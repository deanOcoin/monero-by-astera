[package]
name = "monero-by-astera"
version = "0.2.8"
edition = "2021"

[lib]
name = "monero_by_astera_core"
path = "src/lib.rs"

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
monero = { version = "0.22", default-features = false }
curve25519-dalek = "4"
pbkdf2 = "0.12"
unicode-normalization = "0.1"
sha3 = "0.10"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "socks"] }
digest_auth = "0.3"
rand = "0.8"
sha2 = "0.10"
zeroize = "1"
url = "2"
fs2 = "0.4"
arboard = { version = "3", default-features = false }
argon2 = "0.5"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "s"
